[package]
name = "canary-upgrade-gate"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "canary_upgrade_gate"
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "canary-types/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
canary-types.workspace = true
