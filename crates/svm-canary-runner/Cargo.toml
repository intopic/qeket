[package]
name = "svm-canary-runner"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "canary-gate"
path = "src/main.rs"

[dependencies]
anchor-lang.workspace = true
canary-types.workspace = true
canary-upgrade-gate = { path = "../../programs/canary_upgrade_gate", features = ["no-entrypoint"] }
litesvm = "=0.7.1"
# The feature set type LiteSVM 0.7.1 is built with.
agave-feature-set = "=2.3.13"
solana-sdk-ids = "=2.2.1"
solana-compute-budget-interface = "=2.2.2"
solana-compute-budget-instruction = "=2.3.13"
solana-svm-transaction = "=2.3.13"
solana-message = "=2.4.0"
solana-keypair = "=2.2.3"
solana-signer = "=2.2.1"
solana-transaction = { version = "=2.2.3", features = ["bincode"] }
solana-account = "=2.2.1"
solana-ed25519-program = "=2.2.3"
sha2 = "0.10"
bincode = "1.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
