name: Canary MVP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      OPENSSL_NO_VENDOR: "1"
      CANARY_SBF_TOOLCHAIN: canary-sbf-v1.58
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare pinned compilers
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0
          archive="$RUNNER_TEMP/platform-tools.tar.bz2"
          tools="$RUNNER_TEMP/platform-tools"
          curl --fail --location --retry 3 --retry-all-errors --output "$archive" https://github.com/anza-xyz/platform-tools/releases/download/v1.58/platform-tools-linux-x86_64.tar.bz2
          echo "7b82eb420b5aebd1e5590db0ae25c523eca06724d4238ae02139690535636c37  $archive" | sha256sum --check
          mkdir -p "$tools"
          tar -xjf "$archive" -C "$tools"
          compiler=$(find "$tools" -type f -path '*/rust/bin/rustc' -print -quit)
          test -x "$compiler"
          rustup toolchain link "$CANARY_SBF_TOOLCHAIN" "$(dirname "$(dirname "$compiler")")"
          rustc +"$CANARY_SBF_TOOLCHAIN" --version
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path examples/counter/Cargo.toml
      - name: Check Rust workspace
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked --offline
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-worker.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and run the local upgrade
        run: python3 scripts/mvp.py --load-test
      - name: Fuzz signed votes against the gate ELF
        run: target/debug/canary-gate fuzz-votes target/sbpf-solana-solana/release/canary_upgrade_gate.so 20000 1795204278 | tee target/mvp/evidence/vote-fuzz.json
      - name: Run Trident campaigns against the built gate
        run: |
          cd trident-tests
          cargo build --release --locked --bin fuzz_policy
          export TRIDENT_WITH_EXIT_CODE=1 FUZZING_METRICS=1 CANARY_FUZZ_ITERATIONS=1000000
          export TRIDENT_FUZZ_SEED=99a3b7907abc9021042f7f221417ce6faa51fc355c6d93d027e836be36ac5075
          evidence="$GITHUB_WORKSPACE/target/mvp/evidence/trident"
          mkdir -p "$evidence"
          sha256sum ../target/sbpf-solana-solana/release/canary_upgrade_gate.so fuzz_policy/main.rs Cargo.lock > "$evidence/sha256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/commit.txt"
          for scenario in propose_config_update reclaim_buffer reclaim_orphan_buffer transfer_program_authority_guards execute_gated_upgrade_guards; do
            CANARY_FUZZ_SCENARIO="$scenario" FUZZING_JSON="$evidence/$scenario.json" \
              target/release/fuzz_policy > "$evidence/$scenario.log" 2>&1 || { tail -80 "$evidence/$scenario.log"; exit 1; }
            python3 - "$evidence/$scenario.json" <<'PY'
          import json, os, sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_bytes())
          rows = report["transactions"].values()
          assert sum(row["transaction_invoked"] for row in rows) >= int(os.environ["CANARY_FUZZ_ITERATIONS"])
          assert all(row["transaction_panicked"] == 0 for row in rows)
          PY
          done
      - name: Preserve verified binaries and replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: canary-mvp-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/sbpf-solana-solana/release/canary_upgrade_gate.so
            target/mvp/baseline/sbpf-solana-solana/release/canary_counter.so
            target/mvp/candidate/sbpf-solana-solana/release/canary_counter.so
            target/mvp/evidence/
  devnet:
    name: Devnet RPC compatibility
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: canary-mvp-${{ github.sha }}
          path: verified
      - name: Check loader, program address and compact vote fee on Devnet
        run: python3 scripts/devnet.py verified
      - uses: actions/upload-artifact@v4
        with:
          name: devnet-report-${{ github.sha }}
          path: devnet-report.json
          if-no-files-found: error
