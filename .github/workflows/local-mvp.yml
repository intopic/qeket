name: Local MVP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      OPENSSL_NO_VENDOR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned compilers
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0
          cargo install cargo-build-sbf --version 4.5.0 --locked
          cargo build-sbf --install-only --tools-version v1.58
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path examples/counter/Cargo.toml
      - name: Check Rust workspace
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked --offline
      - name: Build and run the local upgrade
        run: python3 scripts/mvp.py
