name: Live Devnet counter
on:
  workflow_dispatch:
    inputs:
      replay_transactions:
        description: "Number of Devnet counter transactions (50–100)"
        default: "50"
        type: string
  push:
    paths:
      - '.github/workflows/live-devnet.yml'
      - 'scripts/live_build.sh'
      - 'scripts/live_cycle.py'
      - 'scripts/live_capture.py'
      - 'scripts/live_prestate.py'
      - 'scripts/test_live_prestate.py'
      - 'scripts/fly_listener.py'
      - 'scripts/worker_http.py'
      - 'scripts/worker_notify.py'
      - 'scripts/customer_admin.py'
      - 'packages/squads-adapter/**'
      - 'scripts/test_fly_listener.py'
      - 'scripts/test_worker_http.py'
      - 'deploy/fly/**'
permissions:
  contents: read
concurrency:
  group: live-devnet
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      OPENSSL_NO_VENDOR: '1'
      CANARY_SBF_TOOLCHAIN: canary-sbf-v1.58
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: pip install --disable-pip-version-check solders==0.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the Squads instruction adapter
        working-directory: packages/squads-adapter
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Check listener admission policy
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare Devnet identities
        if: github.event_name == 'workflow_dispatch'
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          DEVNET_PAYER: ${{ secrets.DEVNET_PAYER }}
          GATE_PROGRAM_KEYPAIR: ${{ secrets.GATE_PROGRAM_KEYPAIR }}
        run: |
          test -n "$RPC_URL" && test -n "$DEVNET_PAYER" || { echo "Set RPC_URL and DEVNET_PAYER in Actions secrets"; exit 1; }
          umask 077
          python scripts/live_cycle.py prepare
      - name: Prepare disposable validator identities
        if: github.event_name == 'push'
        run: |
          umask 077
          DEVNET_PAYER="$(python -c 'from solders.keypair import Keypair;print(Keypair().to_json())')" python scripts/live_cycle.py prepare
      - name: Prepare pinned platform tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
          curl -fsSL --retry 3 https://github.com/anza-xyz/platform-tools/releases/download/v1.58/platform-tools-linux-x86_64.tar.bz2 -o "$RUNNER_TEMP/tools.tbz"
          echo "7b82eb420b5aebd1e5590db0ae25c523eca06724d4238ae02139690535636c37  $RUNNER_TEMP/tools.tbz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sdk"
          tar xf "$RUNNER_TEMP/tools.tbz" -C "$RUNNER_TEMP/sdk"
          compiler=$(find "$RUNNER_TEMP/sdk" -path '*/rust/bin/rustc' -print -quit)
          rustup toolchain link "$CANARY_SBF_TOOLCHAIN" "$(dirname "$(dirname "$compiler")")"
      - name: Install Solana Verify
        run: |
          curl -fsSL --retry 3 https://github.com/solana-foundation/solana-verifiable-build/releases/download/v0.4.15/solana-verify-0.4.15-linux -o "$HOME/.cargo/bin/solana-verify"
          echo "251db253040a3c2637f551eb6627aae792da787a5f8dfdedb59874e13f27c2da  $HOME/.cargo/bin/solana-verify" | sha256sum -c -
          chmod +x "$HOME/.cargo/bin/solana-verify"
      - name: Rebuild counter twice in offline Docker
        run: bash scripts/live_build.sh
      - name: Build gate and replay client
        run: |
          cargo fetch --locked
          cargo +"$CANARY_SBF_TOOLCHAIN" build --offline --locked --target sbpf-solana-solana --release -p canary-upgrade-gate
          cargo build --offline --locked -p svm-canary-runner
          python -m py_compile scripts/live_capture.py scripts/live_cycle.py scripts/fly_listener.py
      - name: Install deploy CLI
        run: |
          curl -fsSL --retry 3 https://github.com/anza-xyz/agave/releases/download/v2.3.13/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/cli.tbz"
          echo "c43539ebdf6942472e8b87635d6ea55f428a51e3d0219f7b6f720fc6b19fade0  $RUNNER_TEMP/cli.tbz" | sha256sum -c -
          tar xf "$RUNNER_TEMP/cli.tbz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Rehearse complete cycle on disposable validator
        if: github.event_name == 'push'
        env:
          RPC_URL: http://127.0.0.1:8899
        run: |
          sudo sysctl -w kernel.io_uring_disabled=0
          solana-test-validator --bind-address 127.0.0.1 --ledger "$RUNNER_TEMP/ledger" --mint "$(solana-keygen pubkey "$RUNNER_TEMP/devnet-keys/payer")" > "$RUNNER_TEMP/validator.log" 2>&1 &
          validator=$!
          trap 'tail -40 "$RUNNER_TEMP/validator.log"; tail -40 "$RUNNER_TEMP/ledger/validator.log" || true; kill "$validator" 2>/dev/null || true' EXIT
          for i in {1..90}; do
            kill -0 "$validator" || exit 1
            if solana -u "$RPC_URL" slot >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python scripts/live_cycle.py run
      - name: Run finalized cycle
        if: github.event_name == 'workflow_dispatch'
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          CANARY_SAMPLE_COUNT: ${{ inputs.replay_transactions }}
        run: python scripts/live_cycle.py run
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: devnet-live-${{ github.run_id }}
          path: target/live/
          if-no-files-found: ignore
      - name: Check optional Fly.io connection
        if: success() && github.event_name == 'workflow_dispatch'
        id: fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        if: steps.fly.outputs.enabled == 'true'
      - name: Deploy proposal listener
        if: steps.fly.outputs.enabled == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
          CANARY_CUSTOMERS: ${{ secrets.CANARY_CUSTOMERS }}
          HELIUS_WEBHOOK_AUTHORIZATION: ${{ secrets.HELIUS_WEBHOOK_AUTHORIZATION }}
          CANARY_ADMIN_TOKEN: ${{ secrets.CANARY_ADMIN_TOKEN }}
          CANARY_SLACK_WEBHOOK: ${{ secrets.CANARY_SLACK_WEBHOOK }}
          CANARY_TELEGRAM_BOT_TOKEN: ${{ secrets.CANARY_TELEGRAM_BOT_TOKEN }}
          CANARY_TELEGRAM_CHAT_ID: ${{ secrets.CANARY_TELEGRAM_CHAT_ID }}
          CANARY_VERIFIER_PUBKEY: ${{ vars.CANARY_VERIFIER_PUBKEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          gate=$(python -c 'import sys;sys.path.insert(0,"scripts");from live_cycle import key;print(key("gate").pubkey())')
          app="${FLY_APP:-canary-$(echo "$gate" | cut -c1-16 | tr '[:upper:]' '[:lower:]')}"
          PYTHONPATH=scripts python -c 'import os; from fly_listener import customer_policies; customer_policies(os.environ["CANARY_CUSTOMERS"])'
          flyctl status -a "$app" >/dev/null 2>&1 || flyctl apps create "$app" --org personal
          python -c 'import json,os,sys; print("RPC_URL="+os.environ["RPC_URL"]); print("GATE_PROGRAM_ID="+sys.argv[1]); print("CANARY_CUSTOMERS="+json.dumps(json.loads(os.environ["CANARY_CUSTOMERS"]))); [print(k+"="+os.environ[k]) for k in ("HELIUS_WEBHOOK_AUTHORIZATION","CANARY_ADMIN_TOKEN","CANARY_SLACK_WEBHOOK","CANARY_TELEGRAM_BOT_TOKEN","CANARY_TELEGRAM_CHAT_ID","CANARY_VERIFIER_PUBKEY") if os.environ.get(k)]' "$gate" | flyctl secrets import --stage -a "$app"
          context="$RUNNER_TEMP/fly-worker"
          mkdir -p "$context/scripts" "$context/deploy/fly"
          cp scripts/{devnet,live_capture,live_prestate,fly_listener,customer_admin,worker_http,worker_notify}.py "$context/scripts/"
          cp deploy/fly/* "$context/deploy/fly/"
          cd "$context"
          flyctl deploy --ha=false --remote-only -c deploy/fly/fly.toml -a "$app"
