name: Live Devnet counter
on:
  workflow_dispatch:
    inputs:
      replay_transactions:
        description: "Number of Devnet counter transactions (50-100)"
        default: "50"
        type: string
  push:
    paths:
      - '.github/workflows/live-devnet.yml'
      - 'scripts/live_build.sh'
      - 'scripts/live_cycle.py'
      - 'scripts/live_capture.py'
      - 'scripts/live_prestate.py'
      - 'scripts/test_live_prestate.py'
      - 'scripts/fly_listener.py'
      - 'scripts/worker_http.py'
      - 'scripts/worker_notify.py'
      - 'scripts/customer_admin.py'
      - 'packages/squads-adapter/**'
      - 'packages/github-action/**'
      - 'scripts/test_fly_listener.py'
      - 'scripts/test_watch.py'
      - 'scripts/test_worker_http.py'
      - 'scripts/worker_build.py'
      - 'scripts/worker_vote.py'
      - 'scripts/solana_tx.py'
      - 'scripts/e2e_verifier.py'
      - 'scripts/ci_tools.sh'
      - 'crates/svm-canary-runner/**'
      - 'deploy/fly/**'
permissions:
  contents: read
concurrency:
  group: live-devnet
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      OPENSSL_NO_VENDOR: '1'
      CANARY_SBF_TOOLCHAIN: canary-sbf-v1.58
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: pip install --disable-pip-version-check solders==0.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the Squads instruction adapter
        working-directory: packages/squads-adapter
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Check listener admission policy
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare Devnet identities
        if: github.event_name == 'workflow_dispatch'
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          DEVNET_PAYER: ${{ secrets.DEVNET_PAYER }}
          GATE_PROGRAM_KEYPAIR: ${{ secrets.GATE_PROGRAM_KEYPAIR }}
        run: |
          test -n "$RPC_URL" && test -n "$DEVNET_PAYER" || { echo "Set RPC_URL and DEVNET_PAYER in Actions secrets"; exit 1; }
          umask 077
          python scripts/live_cycle.py prepare
      - name: Prepare disposable validator identities
        if: github.event_name == 'push'
        run: |
          umask 077
          DEVNET_PAYER="$(python -c 'from solders.keypair import Keypair;print(Keypair().to_json())')" python scripts/live_cycle.py prepare
      - name: Prepare pinned platform tools
        run: bash scripts/ci_tools.sh
      - name: Install Solana Verify
        run: |
          curl -fsSL --retry 3 --retry-all-errors https://github.com/solana-foundation/solana-verifiable-build/releases/download/v0.4.15/solana-verify-0.4.15-linux -o "$HOME/.cargo/bin/solana-verify"
          echo "251db253040a3c2637f551eb6627aae792da787a5f8dfdedb59874e13f27c2da  $HOME/.cargo/bin/solana-verify" | sha256sum -c -
          chmod +x "$HOME/.cargo/bin/solana-verify"
      - name: Build the proposer binaries in offline Docker
        run: bash scripts/live_build.sh
      - name: Build gate and replay client
        run: |
          cargo fetch --locked
          cargo +"$CANARY_SBF_TOOLCHAIN" build --offline --locked --target sbpf-solana-solana --release -p canary-upgrade-gate
          cargo build --offline --locked -p svm-canary-runner
          python -m py_compile scripts/live_capture.py scripts/live_cycle.py scripts/fly_listener.py
      - name: Install deploy CLI
        run: |
          curl -fsSL --retry 3 --retry-all-errors https://github.com/anza-xyz/agave/releases/download/v2.3.13/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/cli.tbz"
          echo "c43539ebdf6942472e8b87635d6ea55f428a51e3d0219f7b6f720fc6b19fade0  $RUNNER_TEMP/cli.tbz" | sha256sum -c -
          tar xf "$RUNNER_TEMP/cli.tbz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Run cycle with one verifier
        env:
          RPC_URL: ${{ github.event_name == 'push' && 'http://127.0.0.1:8899' || secrets.RPC_URL }}
          CANARY_SAMPLE_COUNT: ${{ inputs.replay_transactions || '50' }}
          CANARY_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          work="$RUNNER_TEMP/verifier"
          validator=
          cleanup() {
            tail -120 "$work/worker.log" || true
            python scripts/e2e_verifier.py stop --workdir "$work"
            if [ -n "$validator" ]; then
              tail -40 "$RUNNER_TEMP/validator.log" || true
              tail -40 "$RUNNER_TEMP/ledger/validator.log" || true
              kill "$validator" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            sudo sysctl -w kernel.io_uring_disabled=0
            solana-test-validator --bind-address 127.0.0.1 --ledger "$RUNNER_TEMP/ledger" --mint "$(solana-keygen pubkey "$RUNNER_TEMP/devnet-keys/payer")" > "$RUNNER_TEMP/validator.log" 2>&1 &
            validator=$!
            for i in {1..90}; do
              kill -0 "$validator" || exit 1
              if solana -u "$RPC_URL" slot >/dev/null 2>&1; then break; fi
              sleep 1
            done
          fi
          python scripts/e2e_verifier.py start --workdir "$work"
          python scripts/live_cycle.py run
          python scripts/e2e_verifier.py wait --workdir "$work" --timeout 300 --until executed --expected-transactions "$CANARY_SAMPLE_COUNT"
          gate=$(python -c 'import sys; sys.path.insert(0, "scripts"); from live_cycle import key; print(key("gate").pubkey())')
          target=$(python -c 'import sys; sys.path.insert(0, "scripts"); from live_cycle import key; print(key("target").pubkey())')
          status=$(node packages/squads-adapter/dist/cli.js status --gate "$gate" --target "$target")
          echo "$status"
          echo "$status" | python -c 'import json, sys; s = json.load(sys.stdin); assert s["status"] == "Executed" and s["votes"] == "1/1", s'
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: devnet-live-${{ github.run_id }}
          path: target/live/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: devnet-verifier-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/verifier/worker.log
            ${{ runner.temp }}/verifier/admissions.sqlite3
            ${{ runner.temp }}/verifier/jobs/*/archive.json
            ${{ runner.temp }}/verifier/jobs/*/evidence.json
          if-no-files-found: ignore
