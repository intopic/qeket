name: Deploy Fly verifier
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-verifiers
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GATE_PROGRAM_ID: ${{ vars.CANARY_DEVNET_GATE_PROGRAM_ID }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_VERIFIER_A }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      - name: Validate the configured Devnet gate
        env:
          RPC_URL: ${{ secrets.RPC_URL || 'https://api.devnet.solana.com' }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          from devnet import GENESIS, LOADER, from_base58
          from live_capture import FINAL, rpc

          gate = os.environ["GATE_PROGRAM_ID"]
          if not gate or len(from_base58(gate)) != 32:
              raise SystemExit("Set CANARY_DEVNET_GATE_PROGRAM_ID to the deployed 1/1-compatible gate")
          if rpc("getGenesisHash") != GENESIS:
              raise SystemExit("Expected a Devnet RPC endpoint")
          account = rpc("getAccountInfo", gate, dict(FINAL, encoding="base64"))["value"]
          if not account or not account["executable"] or account["owner"] != LOADER:
              raise SystemExit("Configured Devnet gate is not a loader-v3 executable")
          PY
      - name: Check required Fly secrets
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo "Set FLY_API_TOKEN_VERIFIER_A in Actions secrets"; exit 1; }
          list() { flyctl secrets list -a canary-verifier-a --json | python3 -c 'import json,sys; print(" ".join(s.get("name", s.get("Name", "")) for s in json.load(sys.stdin)))'; }
          names=$(list)
          # The Devnet endpoint may come from the repository secret. Vote keys never do.
          case " $names " in *" RPC_URL "*) ;; *)
            if [ -n "$RPC_URL" ]; then
              printf 'RPC_URL=%s\n' "$RPC_URL" | flyctl secrets import --stage -a canary-verifier-a >/dev/null
              names="$names RPC_URL"
            fi;;
          esac
          for name in RPC_URL CANARY_VERIFIER_KEYPAIR CANARY_CUSTOMERS; do
            case " $names " in *" $name "*) ;; *) echo "missing Fly secret $name on canary-verifier-a"; exit 1;; esac
          done
      - name: Stage build context
        run: |
          context="$RUNNER_TEMP/context"
          mkdir -p "$context/scripts" "$context/deploy/fly/verifier"
          cp -r Cargo.toml Cargo.lock crates programs "$context/"
          cp scripts/{devnet,live_capture,live_prestate,fly_listener,customer_admin,worker_http,worker_notify,solana_tx,worker_build,worker_vote}.py "$context/scripts/"
          cp scripts/requirements-worker.txt "$context/scripts/"
          cp deploy/fly/verifier/* "$context/deploy/fly/verifier/"
      - name: Deploy
        working-directory: ${{ runner.temp }}/context
        run: |
          flyctl deploy --remote-only --ha=false -a canary-verifier-a -c deploy/fly/verifier/fly.toml \
            --dockerfile deploy/fly/verifier/Dockerfile --build-arg "GATE_PROGRAM_ID=$GATE_PROGRAM_ID" \
            --env "GATE_PROGRAM_ID=$GATE_PROGRAM_ID"
