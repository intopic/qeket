primary_region = "fra"
[build]
  dockerfile = "deploy/fly/Dockerfile"
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "canary_admissions"
  destination = "/data"
  initial_size = "1gb"


[env]
  CANARY_HTTP_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/health"
