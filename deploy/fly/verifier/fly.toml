# Single verifier. Deploy from a staged repository copy with
#   flyctl deploy -c deploy/fly/verifier/fly.toml --dockerfile deploy/fly/verifier/Dockerfile
app = "canary-verifier-a"
primary_region = "fra"
swap_size_mb = 2048
kill_timeout = 30

[env]
  CANARY_GATE_BIN = "/usr/local/bin/canary-gate"
  CANARY_HTTP_PORT = "8080"
  CANARY_CLUSTER = "devnet"
  # The Machine itself bounds CPU and memory.
  CANARY_DOCKER_RESOURCE_LIMITS = "0"
  CANARY_EPHEMERAL_CARGO_HOME = "1"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

# Platform tools (1.7 GB), the builder image and Docker layers (about 3 GB),
# temporary build trees, jobs and SQLite.
[mounts]
  source = "canary_data"
  destination = "/data"
  initial_size = "10gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10m"
    method = "GET"
    path = "/health"
