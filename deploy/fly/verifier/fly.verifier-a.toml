# Independent verifier a. Deploy from a staged repository copy with
#   flyctl deploy -c deploy/fly/verifier/fly.verifier-a.toml --dockerfile deploy/fly/verifier/Dockerfile
app = "canary-verifier-a"
primary_region = "fra"
swap_size_mb = 2048
kill_timeout = 30

[build.args]
  GATE_PROGRAM_ID = "GdmM9gBp8j8reyHyoLTPGfvYtMYpqd2yU1yeob5z1MJw"

[env]
  GATE_PROGRAM_ID = "GdmM9gBp8j8reyHyoLTPGfvYtMYpqd2yU1yeob5z1MJw"
  CANARY_GATE_BIN = "/usr/local/bin/canary-gate"
  CANARY_HTTP_PORT = "8080"
  CANARY_BUILDER_HOST = "canary-builder-a.internal"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

# SQLite and temporary verifier jobs.
[mounts]
  source = "canary_data"
  destination = "/data"
  initial_size = "20gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10m"
    method = "GET"
    path = "/health"
